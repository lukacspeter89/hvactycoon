<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Épületgépész Iroda Tycoon — épületgépészeti tervezőiroda szimulátor</title>
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#1c2733; --muted:#5c6b7a; --line:#dde3ea;
  --navy:#14293d; --accent:#0e7a8a; --accent2:#0e5f8a;
  --ok:#1a7f4e; --warn:#b96a00; --bad:#b3362c; --gold:#8a6d0e;
  --chip:#eaf2f4;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14px}
button{font-family:inherit; cursor:pointer}
.hdr{background:var(--navy); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; position:sticky; top:0; z-index:50}
.hdr h1{font-size:17px; font-weight:600; letter-spacing:.3px}
.hdr h1 span{color:#7fd1de; font-weight:400}
.hdr .date{font-size:15px; font-weight:600; min-width:150px}
.hdr .cash{font-size:16px; font-weight:700}
.hdr .cash.neg{color:#ff9b8f}
.stagebadge{background:#1f3d58; border:1px solid #35597c; padding:3px 10px; border-radius:20px; font-size:12px; color:#bcd6ea}
.spd{display:flex; gap:4px; margin-left:auto}
.spd button{background:#1f3d58; color:#cfe3f2; border:1px solid #35597c; border-radius:6px; padding:5px 11px; font-size:13px}
.spd button.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:10px; padding:12px 18px 0}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px}
.kpi .l{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}
.kpi .v{font-size:16px; font-weight:700; margin-top:2px}
.kpi .s{font-size:11px; color:var(--muted)}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.warn{color:var(--warn)}
.tabs{display:flex; gap:2px; padding:12px 18px 0; flex-wrap:wrap}
.tabs button{background:transparent; border:none; border-bottom:3px solid transparent; padding:8px 13px; font-size:13.5px; color:var(--muted); font-weight:600; border-radius:6px 6px 0 0}
.tabs button.on{color:var(--accent); border-bottom-color:var(--accent); background:#fff}
.tabs button .badge{background:var(--bad); color:#fff; border-radius:10px; padding:1px 6px; font-size:11px; margin-left:5px}
.tabs button .badge.blue{background:var(--accent)}
main{padding:12px 18px 60px; max-width:1400px}
.panel{display:none}
.panel.on{display:block}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media(max-width:980px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px}
.card h3{font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin-bottom:10px}
.card h3 .r{float:right; text-transform:none; letter-spacing:0; font-weight:400}
.row{display:flex; justify-content:space-between; gap:8px; padding:4px 0; font-size:13.5px}
.row .m{color:var(--muted)}
.hr{border-top:1px solid var(--line); margin:8px 0}
.tag{display:inline-block; background:var(--chip); color:var(--accent2); border-radius:5px; padding:2px 7px; font-size:11.5px; font-weight:600; margin-right:5px}
.tag.gray{background:#eceff3; color:var(--muted)}
.tag.red{background:#f7e5e3; color:var(--bad)}
.tag.green{background:#e2f2e9; color:var(--ok)}
.tag.gold{background:#f5eeda; color:var(--gold)}
.btn{background:var(--accent); color:#fff; border:none; border-radius:7px; padding:7px 14px; font-size:13px; font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff; color:var(--accent2); border:1px solid var(--accent2)}
.btn.danger{background:var(--bad)}
.btn.small{padding:4px 10px; font-size:12px}
.btn:disabled{background:#c3ccd4; border-color:#c3ccd4; color:#fff; cursor:not-allowed}
.lead{border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:10px; background:#fbfcfd}
.lead .t{font-weight:700; font-size:14px}
.lead .d{color:var(--muted); font-size:12.5px; margin:4px 0 8px; line-height:1.45}
.lead .meta{display:flex; flex-wrap:wrap; gap:10px; font-size:12.5px; margin-bottom:8px}
.lead .meta b{font-weight:700}
.quote{background:#f0f6f7; border-radius:8px; padding:10px; margin-top:8px}
.quote input[type=range]{width:100%}
.quote .pr{display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px}
.quote .pr b{font-size:15px}
.proj{border:1px solid var(--line); border-radius:9px; padding:10px 13px; margin-bottom:10px; background:#fbfcfd}
.bar{height:8px; background:#e4e9ee; border-radius:5px; overflow:hidden; margin:6px 0}
.bar i{display:block; height:100%; background:var(--accent); border-radius:5px}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)} .bar i.ok{background:var(--ok)}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; padding:5px 6px; border-bottom:1px solid var(--line)}
td{padding:6px; border-bottom:1px solid #eef1f4}
td.r,th.r{text-align:right}
.log{max-height:420px; overflow-y:auto; font-size:12.8px; line-height:1.5}
.log div{padding:4px 6px; border-bottom:1px solid #f0f2f5}
.log .d{color:var(--muted); margin-right:7px; font-size:11.5px}
.log .ok{color:var(--ok)} .log .bad{color:var(--bad)} .log .warn{color:var(--warn)} .log .info{color:var(--accent2)}
.modalwrap{position:fixed; inset:0; background:rgba(12,24,36,.55); display:none; align-items:center; justify-content:center; z-index:100; padding:16px}
.modalwrap.on{display:flex}
.modal{background:#fff; border-radius:12px; max-width:640px; width:100%; padding:22px; max-height:88vh; overflow-y:auto; box-shadow:0 18px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:920px}
.modal h2{font-size:18px; margin-bottom:10px}
.rep h4{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:12px 0 5px}
.rep .tot{border-top:1px solid var(--line); margin-top:5px; padding-top:5px; font-weight:700}
.modal .body{font-size:14px; line-height:1.55; color:#2a3644}
.modal .opts{margin-top:16px; display:flex; flex-direction:column; gap:8px}
.modal .opts button{text-align:left; background:#f4f7f9; border:1px solid var(--line); border-radius:8px; padding:11px 13px; font-size:13.5px}
.modal .opts button:hover{border-color:var(--accent); background:#eef6f7}
.modal .opts button b{display:block; margin-bottom:2px}
.modal .opts button span{color:var(--muted); font-size:12.5px}
.toast{position:fixed; right:16px; bottom:16px; z-index:120; display:flex; flex-direction:column; gap:8px}
.toast div{background:var(--navy); color:#fff; padding:10px 15px; border-radius:8px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.25); max-width:330px; animation:tin .25s}
.toast div.ok{background:var(--ok)} .toast div.bad{background:var(--bad)} .toast div.warn{background:#8a5200}
@keyframes tin{from{transform:translateY(12px); opacity:0}}
canvas{width:100%; height:190px}
.help{font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:6px}
select,input[type=number],textarea{font-family:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink)}
textarea{width:100%; height:110px; font-family:monospace; font-size:11px}
.slider-row{display:flex; align-items:center; gap:10px}
.slider-row input{flex:1}
.mut{color:var(--muted)}
.big{font-size:19px; font-weight:800}
.empl{border:1px solid var(--line); border-radius:9px; padding:10px 13px; margin-bottom:9px; background:#fbfcfd; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.prodc{border:1px solid var(--line); border-radius:9px; padding:12px 14px; margin-bottom:10px; background:#fbfcfd}
.win{color:var(--ok); font-weight:800}
</style>
</head>

function fmt(n){ n=Math.round(n); const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (n<0?'−':'')+s+' Ft'; }
function fmtS(n){ if(Math.abs(n)>=1e6) return (n/1e6).toFixed(1).replace('.',',')+' M Ft'; return fmt(n); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rnd(a,b+1)); }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function chance(p){ return Math.random()<p; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function gauss(){ return (Math.random()+Math.random()+Math.random())/3; }
const HMON=['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
const MLEN=[31,28,31,30,31,30,31,31,30,31,30,31];
function calDate(day){ // day 0 = 2026.01.01
  let y=2026,m=0,d=day;
  for(;;){ const ml=(m===1&&((y%4===0&&y%100!==0)||y%400===0))?29:MLEN[m];
    if(d<ml) return {y,m,d:d+1};
    d-=ml; m++; if(m===12){m=0;y++;} }
}
function dateStr(day){ const c=calDate(day); return c.y+'. '+HMON[c.m]+' '+c.d+'.'; }
function dateShort(day){ const c=calDate(day); return (c.m+1).toString().padStart(2,'0')+'.'+c.d.toString().padStart(2,'0')+'.'; }
function monthKey(day){ const c=calDate(day); return c.y*12+c.m; }

  if(!S.subs)S.subs=[];
  if(!S.subPool)S.subPool=[];
  if(S.subCostMonth==null)S.subCostMonth=0;
  if(!S.alloc)S.alloc={proj:6,prod:2,net:1,rest:1};
  if(S.todayFree==null)S.todayFree=0;
  if(S.living==null)S.living=350000;
  if(!S.monthLedger)S.monthLedger=[];
  if(!S.internals)S.internals={};
}
function addLog(txt,cls){ S.log.unshift({d:S.day,t:txt,c:cls||''}); if(S.log.length>250) S.log.pop(); }
function toast(txt,cls){ const t=document.getElementById('toast'); const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=txt; t.appendChild(d); setTimeout(()=>d.remove(),5200); }
function money(delta,why,cls){ S.cash+=delta; if(delta>0){S.monthAcc.rev+= (why&&why.cost)?0:0;} }
function income(a,txt,isProd){ S.cash+=a; S.monthAcc.rev+=a; if(isProd)S.monthAcc.prodRev+=a; if(txt)addLog('+'+fmt(a)+' — '+txt,'ok'); if(S.monthLedger)S.monthLedger.push({t:txt||'bevétel',a:Math.round(a),k:isProd?'prod':'in'}); }
function expense(a,txt){ S.cash-=a; S.monthAcc.cost+=a; if(txt)addLog('−'+fmt(a)+' — '+txt,'bad'); if(S.monthLedger)S.monthLedger.push({t:txt||'kiadás',a:Math.round(a),k:'out'}); }
/* ============ KAPACITÁS ============ */
function baseHours(){ return S.form==='mellek'?25:45+(S.weekendWork?9:0); }
function playerDailyHours(){
  const d=dow(S.day);
  if(S.form==='mellek') return d<5?3:(d===5?7:5);
  return d<5?9:(S.weekendWork?(d===5?5:4):0);
}
function newDaySetup(){ S.todayFree=Math.round(playerDailyHours()*playerEff()*2)/2; }
function quoteCost(l){ return l.tender?8: l.estRef>2000000?4: l.estRef>400000?2:1; }
function playerEff(){
  let e=1;
  if(S.stress>75) e*=0.8;
  if(S.day<S.sickUntil) e*=0.25;
  return e;
}
function weeklyCapacity(){
  let h=baseHours()*playerEff();
  for(const em of S.employees){
    let eff=em.eff;
    if(S.day-em.hired<35) eff*=0.5;           // betanulás
    if(em.morale<40) eff*=0.75;
    h+=eff;
  }
  h-=S.employees.length*1.5;                   // menedzsment-teher
  for(const sb of S.subs) h+=sb.cap*0.9;       // alvállalkozók (koordinációs veszteséggel)
  for(const pid in S.products){ const p=S.products[pid]; if(p.live){ const cfg=PRODUCTS.find(x=>x.id===pid); h-=cfg.maintH*0.25; } }
  return Math.max(2,h);
}
function usedHoursWeekly(){
  let u=0; for(const p of S.projects) u+=Math.min(8, p.hLeft/((p.deadline-S.day)/7+0.01));
  return u;
}
function signerSlots(){ let s=S.form==='mellek'?2:4; for(const e of S.employees) if(e.lic)s+=4; return s; }

/* ============ AJÁNLATKÉRÉSEK ============ */
function leadRate(){ // lead/nap várható érték
  let r=0.14 + S.rep/220 + S.marketing/900000;
  r*= (S.form==='mellek'?0.7:1);
  r*= S.market;
  for(const m of S.mods) if(m.type==='leads') r*=m.mag;
  for(const pa of S.partners) r+= pa.rel*0.012;
  return r;
}
function clientName(cl){
  if(cl==='magan')return pick(CLIENT_NAMES);
  if(cl==='epitesz'){ if(S.partners.length&&chance(0.55)) return pick(S.partners).name; return pick(ARCH_NAMES); }
  if(cl==='kivitelezo')return pick(CONTR_NAMES);
  if(cl==='beruhazo')return pick(DEV_NAMES);
  return pick(GOV_NAMES);
}
function formRank(f){ return f==='mellek'?0:f==='foallas'?1:2; }
function genLead(){
  const avail=PTYPES.filter(t=>{
    if(formRank(S.form)<formRank(t.min))return false;
    if(t.team && S.employees.length<t.team)return false;
    if(t.needIns && !S.insurance)return false;
    if(t.needRef && S.counters.doneBig<t.needRef)return false;
    if(t.id==='tender' && !chance(0.35)) return false;
    return true;
  });
  if(!avail.length)return;
  // kisebb munkák gyakoribbak
  const w=avail.map(t=>1/Math.sqrt(t.ref/100000));
  let tot=w.reduce((a,b)=>a+b,0), x=Math.random()*tot, t=avail[0];
  for(let i=0;i<avail.length;i++){ if(x<w[i]){t=avail[i];break;} x-=w[i]; }
  let cl=pick(t.cl);
  let sizeF=rnd(0.75,1.35);
  let priceMod=1; for(const m of S.mods) if(m.type==='price') priceMod*=m.mag;
  const trueRef=t.ref*sizeF*S.inflAcc*priceMod;
  const name=clientName(cl);
  const partner=S.partners.find(p=>p.name===name);
  const lead={
    id:S.nextId++, type:t.id, tn:t.n, cl, name,
    desc:pick(t.ds),
    trueRef, estRef:trueRef*rnd(0.88,1.12),
    hours:Math.round(t.h*sizeF*rnd(0.9,1.15)),
    dl:Math.round(t.dl*rnd(0.9,1.2)),
    expires:S.day+ri(4,9),
    tender:!!t.tender, partner:partner?partner.rel:0,
    bidders:t.tender?ri(4,7):0
  };
  S.leads.push(lead);
  addLog('Új ajánlatkérés: '+lead.tn+' — '+lead.name,'info');
  if(S.leads.length>14) S.leads.shift();
}

/* ============ AJÁNLAT / VERSENY ============ */
function submitQuote(leadId, price){
  const li=S.leads.findIndex(l=>l.id===leadId); if(li<0)return;
  const cost=quoteCost(S.leads[li]);
  if(S.todayFree<cost){ toast('Ma már nincs időd ajánlatot írni ehhez ('+cost+' óra kellene). Zárd le a napot!','warn'); return; }
  S.todayFree-=cost;
  const l=S.leads.splice(li,1)[0];
  l.price=price; l.resolve=S.day+ri(2,6);
  S.quotes.push(l);
  addLog('Ajánlat beadva ('+cost+' munkaóra): '+l.tn+' — '+fmt(price),'info');
}
function resolveQuote(q){
  const c=CLIENTS[q.cl];
  const ratio=q.price/q.trueRef;
  let win;
  let reason='';
  if(q.tender){
    // szimulált versenytárs-árak, legalacsonyabb nyer (kis hírnév-súllyal)
    const bids=[]; for(let i=0;i<q.bidders;i++) bids.push(q.trueRef*rnd(0.78,1.05));
    const myScore=q.price*(1-clamp(S.rep-40,0,50)*0.002);
    const best=Math.min.apply(null,bids);
    win=myScore<best;
    reason=win?'A tiéd volt a legjobb pontszámú ajánlat ('+q.bidders+' induló közül).':'Egy másik iroda '+fmt(best)+' körüli áron vitte el ('+q.bidders+' induló).';
  } else {
    let eff=ratio; if(S.vat && q.cl==='magan') eff*=1.14; // ÁFA-hátrány lakosságnál
    let p=1.55-1.25*eff*Math.pow(c.priceSens,0.6);
    p+=S.rep/100*0.22;
    p+=q.partner*0.05;
    for(const m of S.mods) if(m.type==='winp') p+=m.mag;
    if(S.form==='mellek' && q.trueRef>400000) p-=0.08; // "mellékállásban bízhatok benne?"
    p=clamp(p,0.03,0.93);
    win=chance(p);
    if(!win){
      const r=Math.random();
      if(r<0.45) reason='Egy olcsóbb iroda vitte, kb. '+fmt(q.trueRef*rnd(0.72,0.9))+'-ért.';
      else if(r<0.65) reason='A megrendelő ismerőse „megcsinálja olcsóbban".';
      else if(r<0.8) reason='Elhalasztották a beruházást — pénzhiány.';
      else reason='Nagyobb, ismertebb irodát választottak.';
    } else reason='';
  }
  if(win){
    S.counters.won++;
    const adv=CLIENTS[q.cl].advance;
    let hEff=q.hours;
    if(iLive('meretezo')) hEff*=0.82;
    if(iLive('aitan')) hEff*=0.90;
    hEff=Math.max(2,Math.round(hEff));
    const proj={id:S.nextId++, type:q.type, tn:q.tn, cl:q.cl, name:q.name, price:q.price,
      hTot:hEff, hLeft:hEff, deadline:S.day+q.dl, started:S.day, advBilled:false, midBilled:false, rework:0};
    S.projects.push(proj);
    addLog('MEGBÍZÁS! '+q.tn+' — '+q.name+' ('+fmt(q.price)+')','ok');
    toast('Nyertél: '+q.tn+' — '+fmt(q.price),'ok');
    if(adv>0){ makeInvoice(proj, q.price*adv, 'előleg'); }
    else if(q.price>=1800000){ makeInvoice(proj, q.price*0.3,'részszámla (30%)'); }
    if(q.cl==='epitesz') bumpPartner(q.name,1);
  } else {
    S.counters.lost++;
    addLog('Elveszett ajánlat: '+q.tn+' — '+q.name+'. '+reason,'bad');
    toast('Nem nyertük: '+q.tn,'warn');
  }
}
function bumpPartner(name,amt){
  let p=S.partners.find(x=>x.name===name);
  if(!p){ p={name, rel:0}; S.partners.push(p); }
  p.rel=clamp(p.rel+amt,0,5);
}

/* ============ SZÁMLÁK / FIZETÉS ============ */
function vatMul(){ return S.vat?1.27:1; }
function makeInvoice(proj, net, label){
  const c=CLIENTS[proj.cl];
  let due=S.day+c.terms;
  const inv={id:S.nextId++, proj:proj.tn, name:proj.name, cl:proj.cl,
    net, gross:net*vatMul(), due, label, late:false, status:'open'};
  S.invoices.push(inv);
  addLog('Számla kiállítva: '+fmt(inv.gross)+' — '+proj.name+' ('+label+'), fizetési határidő: '+dateStr(due),'info');
}
function payInvoice(inv,label,feeRate){
  inv.status='paid';
  income(inv.gross, inv.name+' fizetett ('+inv.label+')'+(label?' — '+label:''));
  if(feeRate) expense(Math.round(inv.gross*feeRate),'követeléskezelői sikerdíj (12%) — '+inv.name);
}
function defaultInvoice(inv,recMin,recMax){
  inv.status='default'; S.counters.defaults++;
  const rec=chance(0.5)?rnd(recMin,recMax):0;
  const got=inv.gross*rec;
  if(got>0) income(got,'részleges megtérülés — '+inv.name);
  addLog('NEM FIZET: '+inv.name+' — '+fmt(inv.gross-got)+' odaveszett'+(rec>0?' (részben megtérült)':'')+'.','bad');
  toast('Behajthatatlan követelés: '+inv.name,'bad');
  if(S.vat) S.vatOwed-=inv.net*0.27*(1-rec);
}
function demandPayment(id){
  const inv=S.invoices.find(i=>i.id===id);
  if(!inv||inv.status!=='open'||!inv.late||inv.demanded)return;
  if(S.todayFree<1){ toast('A felszólításhoz 1 munkaóra kell — mára elfogyott az időd.','warn'); return; }
  S.todayFree-=1;
  inv.demanded=true;
  inv.due=Math.min(inv.due,S.day+ri(3,10));
  const pa=S.partners.find(p=>p.name===inv.name);
  if(pa&&pa.rel>0){ pa.rel=Math.max(0,pa.rel-1); addLog('A hivatalos hangvétel rosszul esett nekik — a kapcsolat hűvösebb lett: '+inv.name+' (−1★).','warn'); }
  addLog('Fizetési felszólítás kiment: '+inv.name+' ('+fmt(inv.gross)+'). Általában hat...','info');
}
function hireCollector(id){
  const inv=S.invoices.find(i=>i.id===id);
  if(!inv||inv.status!=='open'||!inv.demanded||inv.collector)return;
  if(S.cash<60000){ toast('A követeléskezelő 60 000 Ft megbízási díjat kér előre.','warn'); return; }
  expense(60000,'követeléskezelő megbízási díja — '+inv.name);
  inv.collector=true;
  inv.due=S.day+ri(5,15);
  const pa=S.partners.find(p=>p.name===inv.name);
  if(pa&&pa.rel>0){ pa.rel=Math.max(0,pa.rel-3); }
  S.rep=clamp(S.rep-2,0,100);
  addLog('Követeléskezelő ráállítva: '+inv.name+'. A szakmában ez gyorsan híre megy (hírnév −2'+(pa?', kapcsolat −3★':'')+').','warn');
}
function processInvoices(){
  for(const inv of S.invoices){
    if(inv.status!=='open')continue;
    if(S.day>=inv.due){
      const c=CLIENTS[inv.cl];
      let defP=c.defP; for(const m of S.mods) if(m.type==='defRisk') defP*=m.mag;
      if(iLive('aipiac')) defP*=0.65;
      if(inv.collector){
        if(chance(0.8)) payInvoice(inv,'a követeléskezelő behajtotta',0.12);
        else defaultInvoice(inv,0.25,0.55);
      } else if(inv.demanded){
        if(chance(0.7)) payInvoice(inv,'a felszólítás hatott');
        else if(!inv.dem2){ inv.dem2=true; inv.due=S.day+ri(7,15);
          addLog('A felszólítás ellenére is húzzák a fizetést: '+inv.name+' — jöhet a követeléskezelő?','warn'); }
        else if(chance(Math.min(0.5,defP*4))) defaultInvoice(inv,0.2,0.5);
        else payInvoice(inv);
      } else if(!inv.late && chance(c.lateP)){
        inv.late=true; inv.due=S.day+Math.round(c.lateD*rnd(0.7,1.4));
        addLog('Késik a fizetés: '+inv.name+' ('+fmt(inv.gross)+') — új határidő: '+dateStr(inv.due),'warn');
        toast('Késik: '+inv.name+' — '+fmtS(inv.gross),'warn');
      } else if(inv.late && chance(0.25) && !inv.late2){
        inv.late2=true; inv.due=S.day+ri(10,28);
        addLog('Még mindig nem fizet: '+inv.name+' — újabb ígéret: '+dateStr(inv.due),'warn');
      } else if(inv.late && chance(defP*1.5)){
        defaultInvoice(inv,0.2,0.5);
      } else {
        payInvoice(inv);
      }
    }
  }
  S.invoices=S.invoices.filter(i=>i.status==='open'||S.day-i.due<120);
}
function arTotal(){ let a=0; for(const i of S.invoices) if(i.status==='open')a+=i.gross; return a; }

/* ============ NAPI MUNKA (kör lezárása) ============ */
function endOfDayWork(){
  const w=S.alloc, sum=Math.max(1,w.proj+w.prod+w.net+w.rest);
  const free=Math.max(0,S.todayFree);
  const projP=free*w.proj/sum, prodP=free*w.prod/sum, netH=free*w.net/sum, restH=free*w.rest/sum;
  const d=dow(S.day);
  // alkalmazottak (hétköznap dolgoznak)
  let empH=0;
  if(d<5) for(const em of S.employees){
    let eff=em.eff;
    if(S.day-em.hired<35) eff*=0.5;
    if(em.morale<40) eff*=0.75;
    empH+=eff/5;
  }
  empH=Math.max(0,empH-S.employees.length*0.3); // vezetési teher
  // élő termékek karbantartása
  let maint=0;
  for(const pid in S.products){ const p=S.products[pid]; if(p.live) maint+=PRODUCTS.find(x=>x.id===pid).maintH/30; }
  let projH=Math.max(0, projP+empH-maint-S.subs.length*0.2); // alvállalkozó-koordináció is időbe kerül
  let devH=prodP;
  // projektek: legszorosabb határidő először — előbb a saját (ingyenes) órák
  const act=S.projects.slice().sort((a,b)=>a.deadline-b.deadline);
  for(const p of act){
    if(projH<=0)break;
    const put=Math.min(projH,p.hLeft);
    p.hLeft-=put; projH-=put;
    if(p.hLeft<=0) finishProject(p);
  }
  // aztán az alvállalkozók (csak a ledolgozott órát számlázzák)
  if(d<5 && S.subs.length){
    const bySorted=S.subs.slice().sort((a,b)=>a.rate-b.rate);
    for(const sb of bySorted){
      let avail=sb.cap/5;
      for(const p of S.projects.slice().sort((a,b)=>a.deadline-b.deadline)){
        if(avail<=0)break;
        const put=Math.min(avail,p.hLeft);
        if(put<=0)continue;
        p.hLeft-=put; avail-=put;
        S.subCostMonth+=put*sb.rate;
        if(p.hLeft<=0) finishProject(p);
      }
      const worked=sb.cap/5-avail;
      if(worked>0 && chance(0.012*(1.35-sb.qual))){
        const tp=S.projects.length?pick(S.projects):null;
        if(tp){ const extra=Math.round(rnd(4,12)); tp.hLeft+=extra;
          addLog('Alvállalkozói hiba: '+sb.name+' munkáját javítani kell (+'+extra+' óra) — '+tp.tn,'warn'); }
      }
    }
  }
  if(projH>0) devH+=projH*0.85; // ha elfogyott a projektmunka, marad idő fejleszteni
  // termékfejlesztés
  const queue=[];
  for(const id of Object.keys(S.products)) if(S.products[id].dev&&!S.products[id].live) queue.push({st:S.products[id],cfg:PRODUCTS.find(x=>x.id===id),kind:'p',id});
  for(const id of Object.keys(S.internals)) if(S.internals[id].dev&&!S.internals[id].live) queue.push({st:S.internals[id],cfg:INTERNALS.find(x=>x.id===id),kind:'i',id});
  for(const q of queue){
    if(devH<=0)break;
    const put=Math.min(devH,q.cfg.devH-q.st.devDone);
    q.st.devDone+=put; devH-=put;
    if(q.st.devDone>=q.cfg.devH){ if(q.kind==='p')launchProduct(q.id); else launchInternal(q.id); }
  }
  // kapcsolatépítés (2 óránként egy "találkozó")
  let nh=netH;
  while(nh>=2){
    nh-=2;
    const r=Math.random();
    if(r<0.30){ genLead(); addLog('A kapcsolatépítés új megkeresést hozott!','info'); }
    else if(r<0.55 && S.partners.length) bumpPartner(pick(S.partners).name,0.5);
    else if(r<0.70) bumpPartner(pick(ARCH_NAMES),0.5);
    else S.rep=clamp(S.rep+0.4,0,100);
  }
  // stressz
  const jobH=(S.form==='mellek'&&d<5)?8:0;
  const worked=(free-restH)+jobH;
  let delta=(worked-8)*0.45 - restH*1.1 - (worked<5?1:0);
  S.stress=clamp(S.stress+delta,0,100);
  if(S.stress>=100 && S.day>=S.sickUntil){
    S.sickUntil=S.day+12; S.stress=70;
    queueEvent({t:'Kiégés — az orvos leültetett',
      b:'Hetek óta minden órádat kifacsarod'+(S.form==='mellek'?' a főállásod mellett':'')+'. Beütött: közel két hétig csak minimál tempóban tudsz dolgozni. A határidők nem várnak. (Tipp: hagyj időt pihenésre az időbeosztásban.)',
      o:[{l:'Kénytelen vagy pihenni', s:'A projektjeid lassulnak.', f:()=>{}}]});
  }
  // részszámla nagy projektnél félidőben
  for(const p of S.projects){
    if(p.price>=1800000 && !p.midBilled && p.hLeft<=p.hTot*0.5){
      p.midBilled=true; makeInvoice(p,p.price*0.3,'részszámla (60%-nál)');
    }
  }
}
function finishProject(p){
  const i=S.projects.indexOf(p); if(i>=0)S.projects.splice(i,1);
  S.counters.done++;
  if(p.price>=1800000) S.counters.doneBig++;
  const c=CLIENTS[p.cl];
  let rest=p.price;
  if(c.advance>0) rest-=p.price*c.advance;
  if(p.midBilled) rest-=p.price*0.3;
  if(p.price>=1800000 && c.advance===0) rest-=p.price*0.3; // kezdő részszámla
  let late=S.day>p.deadline;
  if(late){
    const big=p.price>=1000000;
    const pen=p.price*(big?0.1:0.08);
    rest-=pen; S.rep=clamp(S.rep-(big?5:2),0,100);
    addLog('Határidő-csúszás: '+p.tn+' — kötbér '+fmt(pen)+', hírnév −'+(big?5:2),'bad');
  } else {
    S.rep=clamp(S.rep+ (p.price>1800000?3:1.2),0,100);
  }
  makeInvoice(p,Math.max(0,rest),'végszámla');
  addLog('Projekt kész: '+p.tn+' — '+p.name+(late?' (késve)':''),'ok');
  if(p.cl==='epitesz'&&!late) bumpPartner(p.name,1);
}

/* ============ TERMÉKEK ============ */
function startProduct(id){
  const cfg=PRODUCTS.find(x=>x.id===id);
  if(S.products[id])return;
  S.products[id]={dev:true,live:false,devDone:0,subs:0,sold:0,launchAge:0,revLast:0};
  addLog('Termékfejlesztés indult: '+cfg.n,'info');
}
function launchProduct(id){
  const cfg=PRODUCTS.find(x=>x.id===id);
  const p=S.products[id];
  p.dev=false; p.live=true; p.launchAge=0;
  addLog('TERMÉK PIACON: '+cfg.n+'!','ok');
  toast('Piacra került: '+cfg.n,'ok');
}
function productMonthly(){
  for(const id in S.products){
    const p=S.products[id]; if(!p.live)continue;
    const cfg=PRODUCTS.find(x=>x.id===id);
    let rev=0;
    if(cfg.saas){
      const grow=(S.marketing/70000 + S.rep/14 + p.subs*0.06)*S.market*rnd(0.6,1.4);
      const churn=p.subs*rnd(0.02,0.045);
      p.subs=Math.max(0,p.subs+grow-churn);
      rev=Math.round(p.subs)*cfg.price;
      expense(cfg.server,'szerver + üzemeltetés (GépészCalc)');
    } else if(cfg.launch){
      p.launchAge++;
      const base=(S.rep*2.2+S.marketing/50000*8)*Math.exp(-p.launchAge/2.2);
      const sold=Math.round(base*rnd(0.6,1.3));
      p.sold+=sold; rev=sold*cfg.price;
    } else if(id==='tipus'){
      let s=0; for(const pa of S.partners) if(chance(pa.rel*0.12))s++;
      s+=chance(0.5)?ri(0,2):0;
      const sold=Math.round(s*rnd(0.7,1.3)*S.market);
      p.sold+=sold; rev=sold*cfg.price;
    } else {
      const sat=Math.max(0.3,1-p.sold/600);
      const sold=Math.round((S.rep/8+S.marketing/100000)*sat*rnd(0.5,1.5));
      p.sold+=sold; rev=sold*cfg.price;
    }
    p.revLast=rev;
    if(rev>0) income(rev,cfg.n+' — havi termékbevétel',true);
    if(S.vat) S.vatOwed+=rev*0.27/1.27; // bruttóként kezelve
  }
}

  expense(250000,'kurzus újraindító kampány');

  const acc=[28000,48000,98000][S.accountant]+(S.form==='kft'?42000:0);
  expense(acc,'könyvelő');
  expense(S.cadCost,'CAD / szoftverlicencek');
  let itC=0; for(const cfg of INTERNALS) if(iLive(cfg.id)) itC+=cfg.monthly;
  if(itC>0) expense(itC,'belső rendszerek üzemeltetése (ERP, AI)');
  expense(10000,'kamarai tagdíj + továbbképzés (havi rész)');
  if(S.insurance) expense(S.form==='kft'?46000:24000,'tervezői felelősségbiztosítás');
  const rent=[0,290000,680000][S.office];
  if(rent)expense(rent,'irodabérlet + rezsi');
  expense(15000+S.employees.length*9000,'telefon, adminisztráció, apróságok');

}
function monthlyClose(){
  S.counters.months++;
  // bevétel oldal
  if(S.form==='mellek'){ S.cash+=S.jobNet; addLog('+'+fmt(S.jobNet)+' — főállású fizetés','ok'); if(S.monthLedger)S.monthLedger.push({t:'főállású fizetés (magán bevétel)',a:S.jobNet,k:'in'}); }
  productMonthly();
  fixedCosts();
  // bérek
  for(const em of S.employees){
    const cost=Math.round(em.gross*1.13);
    expense(cost,'bér + járulék — '+em.name);
    em.morale=clamp(em.morale+(S.stress>70?-4:1)+(usedHoursWeekly()>weeklyCapacity()?-5:0),0,100);
  }
  if(S.form==='kft'){ expense(Math.round(430000),'ügyvezetői minimálbér + járulékok (te)'); }
  // adó: átalány (EV) — egyszerűsítve havonta
  const rev=S.monthAcc.rev;
  if(S.form!=='kft'){
    const base=rev*0.55;
    S.yearTaxBase+=base;
    let szja=0;
    const freeLimit=3521454;
    if(S.yearTaxBase>freeLimit){
      const taxable=Math.min(base,S.yearTaxBase-freeLimit);
      szja=taxable*0.15;
    }
    let jar=base*0.315;
    if(S.form==='foallas') jar=Math.max(jar,118000); // minimum járulék főállásban
    let tax=szja+jar;
    if(S.accountant===2)tax*=0.93;
    S.taxDue+=tax;
  } else {
    const profit=rev-S.monthAcc.cost;
    if(profit>0) S.taoAcc+=profit*0.09*(S.accountant===2?0.9:1);
  }
  // negyedéves adófizetés
  const c=calDate(S.day);
  if(c.m%3===0){
    if(S.taxDue>0){ expense(Math.round(S.taxDue),'negyedéves adó + járulék (átalányadó)'); S.taxDue=0; }
    if(S.taoAcc>0){ expense(Math.round(S.taoAcc),'társasági adóelőleg (9%)'); S.taoAcc=0; }
    if(S.vat&&S.vatOwed>0){ expense(Math.round(S.vatOwed),'ÁFA befizetés'); S.vatOwed=0; }
  }
  // ÁFA-határ figyelés (AAM 18 M Ft)
  S.yearRev12.push(rev); if(S.yearRev12.length>12)S.yearRev12.shift();
  const rev12=S.yearRev12.reduce((a,b)=>a+b,0);
  if(!S.vat && rev12>18000000){
    S.vat=true;
    queueEvent({t:'Átlépted az alanyi ÁFA-mentesség határát',
      b:'A 12 havi bevételed túllépte a 18 millió forintot, mostantól ÁFA-körbe kerülsz. Céges ügyfeleknek ez mindegy (visszaigénylik), de a lakossági megrendelőknek 27%-kal drágább lettél — az áraidat érdemes újragondolni.',
      o:[{l:'Rendben, vállaljuk', s:'ÁFA-s számlázás mostantól, negyedéves ÁFA-befizetéssel.', f:()=>{}}]});
  }
  // hitel kamatok
  for(const L of S.loans.list){
    const int=L.balance*L.rate/12;
    const pay=Math.min(L.balance+int, L.annuity);
    expense(Math.round(pay),L.n+' törlesztés');
    L.balance=Math.max(0,L.balance+int-pay);
  }
  if(S.loans.od.used>0){ expense(Math.round(S.loans.od.used*0.055/12),'folyószámlahitel kamat'); }
  // folyószámlahitel limit frissítés
  if(S.loans.od.open){ S.loans.od.limit=Math.round(clamp(rev12*0.3,2000000,25000000)); }
  // történet
  const profit=S.monthAcc.rev-S.monthAcc.cost;
  S.hist.push({mk:monthKey(S.day)-1,rev:S.monthAcc.rev,cost:S.monthAcc.cost,prod:S.monthAcc.prodRev,profit,cash:S.cash});
  if(S.hist.length>48)S.hist.shift();
  if(typeof buildMonthlyReport==='function') buildMonthlyReport(monthKey(S.day)-1,S.monthAcc.rev,S.monthAcc.cost,profit);
  // győzelmi feltétel számláló
  const winNow = S.employees.length>=4 && S.monthAcc.prodRev>=2000000 && S.cash>=30000000 && S.rep>=75;
  S.winStreak=winNow?S.winStreak+1:0;
  S.monthAcc={rev:0,cost:0,prodRev:0,tax:0};
  // évfordulós tételek
  if(c.m===0){
    S.inflAcc*=rnd(1.04,1.075);
    S.cadCost=Math.round(S.cadCost*rnd(1.04,1.1));
    S.living=Math.round(S.living*rnd(1.04,1.08)/1000)*1000;
    expense(85000,'éves kamarai jogosultság-megújítás, kötelező továbbképzés');
    addLog('Új év: az árak és a költségek emelkedtek (infláció).','info');
  }
  // piaci ciklus lassú mozgása
  S.market=clamp(S.market+rnd(-0.06,0.06),0.55,1.5);
  // partnerek lassú felejtése
  for(const pa of S.partners) if(chance(0.2)) pa.rel=Math.max(0,pa.rel-0.5);
  S.partners=S.partners.filter(p=>p.rel>0);
  // alvállalkozói számlák
  if(S.subCostMonth>0){ expense(Math.round(S.subCostMonth),'alvállalkozói tervezői díjak'); S.subCostMonth=0; }
  // alvállalkozó továbbáll?
  for(let i=S.subs.length-1;i>=0;i--){
    const quitP=0.08+(S.market>1.1?0.1:0);
    if(chance(quitP)){ const sb=S.subs.splice(i,1)[0];
      addLog('Alvállalkozó kiszállt: '+sb.name+' — talált magának nagyobb falatot.','warn'); }
  }
  genSubPool();
  // jelöltek frissítése
  if(S.candRefresh<=0){ refreshCandidates(); S.candRefresh=2; } else S.candRefresh--;
}

/* ============ CSŐD / GYŐZELEM ============ */
function checkSolvency(){
  let avail=S.cash;
  if(S.loans.od.open){
    if(S.cash<0){
      const need=Math.min(-S.cash,S.loans.od.limit-S.loans.od.used);
      if(need>0){ S.loans.od.used+=need; S.cash+=need; }
    } else if(S.loans.od.used>0 && S.cash>0){
      const back=Math.min(S.cash*0.5,S.loans.od.used);
      S.loans.od.used-=back; S.cash-=back;
    }
    avail=S.cash+(S.loans.od.limit-S.loans.od.used);
  }
  if(S.cash<0){
    S.grace++;
    if(S.grace===4) toast('Mínuszban a számla! '+(S.loans.od.open?'A hitelkeret is kimerült!':'Nyiss hitelkeretet vagy szerezz bevételt!'),'bad');
    if(S.grace>14){ S.over=true;
      queueEvent({t:'CSŐD',b:'Elfogyott a pénz, a számlákat nem tudtad fizetni. A cég fizetésképtelenné vált — a történetnek itt vége. Összesen '+S.counters.done+' projektet zártál le, '+S.counters.months+' hónapig húztad.',
        o:[{l:'Új játék kezdése',s:'Tiszta lappal, okosabban.',f:()=>{initGame();}}]});
    }
  } else S.grace=0;
}
function checkWin(){
  if(S.won)return;
  if(S.winStreak>=3){
    S.won=true;
    queueEvent({t:'🏆 STABIL, PIACVEZETŐ IRODA!',
      b:'Megcsináltad: legalább 4 fős csapat, 3 hónapja 2 M Ft feletti havi termékbevétel, 40 M Ft feletti tartalék és 75+ hírnév. Az iroda már nélküled is stabilan termel — ez az, amiért az egészet elkezdted. Játszhatsz tovább szabadon.',
      o:[{l:'Játék folytatása',s:'Építsd tovább birodalmad!',f:()=>{setSpeed(1);}}]});
  }
}
/* ============ ALVÁLLALKOZÓK ============ */
function genSubPool(){
  const maxN=clamp(1+Math.floor(S.rep/22),1,4);
  S.subPool=[];
  const pool=SUB_NAMES.filter(n=>!S.subs.some(x=>x.name===n));
  for(let i=0;i<maxN&&pool.length;i++){
    const name=pool.splice(ri(0,pool.length-1),1)[0];
    const qual=rnd(0.55,1.0);
    S.subPool.push({name, rate:Math.round((6500+qual*5500)*S.inflAcc/500)*500, cap:ri(8,20), qual});
  }
}
function hireSub(i){
  if(S.subs.length>=3){ toast('Háromnál több alvállalkozót nem tudsz koordinálni.','warn'); return; }
  const sb=S.subPool[i]; if(!sb)return;
  S.subPool.splice(i,1);
  S.subs.push({...sb, since:S.day});
  addLog('Alvállalkozó bevonva: '+sb.name+' ('+fmt(sb.rate)+'/óra, ~'+sb.cap+' óra/hét).','ok');
}
function dropSub(i){
  const sb=S.subs[i]; if(!sb)return;
  S.subs.splice(i,1);
  addLog('Alvállalkozói együttműködés lezárva: '+sb.name,'info');
}

function refreshCandidates(){
  S.candidates=[];
  const n=ri(1,3);
  const pool=EMP_NAMES.filter(nm=>!S.employees.some(e=>e.name===nm));
  for(let i=0;i<n&&i<pool.length;i++){
    const lv=pick(EMP_LEVELS.filter(l=> l.id!=='sen'||S.rep>=40 ));
    S.candidates.push({name:pool.splice(ri(0,pool.length-1),1)[0], lvl:lv.id,
      gross:Math.round(lv.gross*rnd(0.92,1.15)*S.inflAcc/1000)*1000, eff:lv.eff*rnd(0.9,1.1), lic:lv.lic});
  }
}
function hire(idx){
  if(S.form!=='kft'){toast('Alkalmazottat csak Kft.-ként vehetsz fel.','warn');return;}
  if(S.employees.length>=2&&S.office===0){toast('Home office-ban max 2 fő fér el — bérelj irodát!','warn');return;}
  const c=S.candidates[idx]; if(!c)return;
  S.candidates.splice(idx,1);
  S.employees.push({name:c.name,lvl:c.lvl,gross:c.gross,eff:c.eff,lic:c.lic,hired:S.day,morale:70});
  expense(180000,'toborzás, munkaeszközök — '+c.name);
  addLog('Felvéve: '+c.name+' ('+EMP_LEVELS.find(l=>l.id===c.lvl).n+')','ok');
}
function fire(i){
  const em=S.employees[i]; if(!em)return;
  expense(Math.round(em.gross*1.5),'felmondási idő + végkielégítés — '+em.name);
  S.employees.splice(i,1);
  S.rep=clamp(S.rep-1,0,100);
  addLog(em.name+' elköszönt a cégtől.','warn');
}
function giveRaise(i){
  const em=S.employees[i]; if(!em)return;
  em.gross=Math.round(em.gross*1.12/1000)*1000; em.morale=clamp(em.morale+25,0,100);
  addLog('Béremelés: '+em.name+' → '+fmt(em.gross)+' bruttó.','info');
}

function cashProjection(days){
  const inflow={};
  for(const inv of S.invoices) if(inv.status==='open'){
    const d=Math.max(1,inv.due-S.day); inflow[d]=(inflow[d]||0)+inv.gross;
  }
  for(const p of S.projects){
    const done=Math.max(1,p.deadline-S.day);
    const payD=done+CLIENTS[p.cl].terms;
    if(payD<=days) inflow[payD]=(inflow[payD]||0)+estRemainingBill(p)*(S.vat?1.27:1);
  }
  const fixT=fixedRows().reduce((a,r)=>a+r[1],0);
  const prodAvg=S.hist.length?S.hist.slice(-3).reduce((a,x)=>a+x.prod,0)/Math.min(3,S.hist.length):0;
  const daily=-fixT/30+prodAvg/30+(S.form==='mellek'?S.jobNet/30:0);
  // következő negyedéves adófizetés napja
  let taxDay=null; const c0=calDate(S.day);
  for(let d=1;d<=days;d++){ const c=calDate(S.day+d); if(c.d===1&&c.m%3===0){ taxDay=d; break; } }
  const out=[]; let c=S.cash;
  for(let d=1;d<=days;d++){
    c+=daily+(inflow[d]||0);
    if(d===taxDay) c-=(S.taxDue+S.taoAcc+(S.vat?S.vatOwed:0));
    out.push(Math.round(c));
  }
  return out;
}
function drawChart(){
  const cv=document.getElementById('chart'); if(!cv)return;
  const ctx=cv.getContext('2d');
  const data=(S.cashSeries||[]).slice(-300);
  const fut=iLive('erp')?cashProjection(60):[];
  ctx.clearRect(0,0,cv.width,cv.height);
  if(data.length<2)return;
  const all=data.concat(fut);
  const min=Math.min(0,...all), max=Math.max(1000000,...all);
  const W=cv.width,H=cv.height,pad=6,n=all.length;
  const x=i=>pad+i/(n-1)*(W-2*pad);
  const y=v=>H-pad-(v-min)/(max-min)*(H-2*pad);
  ctx.strokeStyle='#c9d2da'; ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(pad,y(0)); ctx.lineTo(W-pad,y(0)); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#0e7a8a'; ctx.lineWidth=2; ctx.beginPath();
  data.forEach((v,i)=>{ i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)); });
  ctx.stroke();
  if(fut.length){
    ctx.strokeStyle='#b96a00'; ctx.lineWidth=2; ctx.setLineDash([5,4]); ctx.beginPath();
    ctx.moveTo(x(data.length-1),y(data[data.length-1]));
    fut.forEach((v,i)=>ctx.lineTo(x(data.length+i),y(v)));
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#b96a00'; ctx.font='11px sans-serif';
    ctx.fillText('ERP előrejelzés (ha mindenki időben fizet)',x(data.length-1)-160,H-8);
  }
  ctx.fillStyle='#5c6b7a'; ctx.font='11px sans-serif';
  ctx.fillText(fmtS(max),pad+2,12); ctx.fillText(fmtS(min),pad+2,H-8);
}

/* --- Ajánlatkérések --- */
function chanceLabel(l,price){
  const c=CLIENTS[l.cl];
  let eff=price/l.estRef; if(S.vat&&l.cl==='magan')eff*=1.14;
  let p=1.55-1.25*eff*Math.pow(c.priceSens,0.6)+S.rep/100*0.22+l.partner*0.05;
  for(const m of S.mods) if(m.type==='winp')p+=m.mag;
  if(S.form==='mellek'&&l.estRef>400000)p-=0.08;
  p=clamp(p,0.03,0.93);
  if(l.tender)return['?','A tenderen az ár dönt — a becsült keret alá kell menni.'];
  if(p<0.2)return['Alacsony esély','#b3362c'];
  if(p<0.42)return['Közepes esély','#b96a00'];
  if(p<0.65)return['Jó esély','#1a7f4e'];
  return['Nagyon jó esély','#1a7f4e'];
}
function aiBest(l){
  if(!l.aiRef) l.aiRef=l.trueRef*rnd(0.97,1.03);
  if(l.tender){ return {price:Math.round(l.aiRef*0.80/1000)*1000, p:0.62, t:'a várható legalacsonyabb rivális ajánlat alá lő'}; }
  const c=CLIENTS[l.cl];
  let best={price:l.aiRef,ev:0,p:0};
  for(let r=0.6;r<=1.6;r+=0.02){
    const price=l.aiRef*r;
    let eff=price/l.aiRef; if(S.vat&&l.cl==='magan')eff*=1.14;
    let p=1.55-1.25*eff*Math.pow(c.priceSens,0.6)+S.rep/100*0.22+l.partner*0.05;
    for(const m of S.mods) if(m.type==='winp')p+=m.mag;
    if(S.form==='mellek'&&l.aiRef>400000)p-=0.08;
    p=clamp(p,0.03,0.93);
    const ev=p*price;
    if(ev>best.ev)best={price:Math.round(price/1000)*1000,ev,p};
  }
  best.t='a legjobb ár × esély kombináció';
  return best;
}

/* --- Projektek --- */
function pProj(){

/* --- Pénzügyek --- */
function fixedRows(){
  const rows=[];
  if(S.form!=='kft') rows.push(['Megélhetés (magánkivét)',S.living]);
  else rows.push(['Ügyvezetői bér + járulék (ebből élsz)',430000]);
  rows.push(['Könyvelő',[28000,48000,98000][S.accountant]+(S.form==='kft'?42000:0)]);
  rows.push(['CAD / szoftverlicencek',S.cadCost]);
  rows.push(['Kamarai tagdíj, továbbképzés',10000]);
  if(S.insurance) rows.push(['Felelősségbiztosítás',S.form==='kft'?46000:24000]);
  if(S.office) rows.push(['Irodabérlet + rezsi',[0,290000,680000][S.office]]);
  rows.push(['Telefon, adminisztráció',15000+S.employees.length*9000]);
  if(S.marketing) rows.push(['Marketing',S.marketing]);
  for(const em of S.employees) rows.push(['Bér — '+em.name,Math.round(em.gross*1.13)]);
  const saas=S.products['saas'];
  if(saas&&saas.live) rows.push(['Szerver, üzemeltetés (GépészCalc)',35000]);
  let itC=0; for(const cfg of INTERNALS) if(iLive(cfg.id)) itC+=cfg.monthly;
  if(itC>0) rows.push(['Belső rendszerek (ERP, AI)',itC]);
  for(const L of S.loans.list) rows.push([L.n+' törlesztés',Math.round(L.annuity)]);
  if(S.form==='foallas') rows.push(['Minimum járulék (az adóval együtt fizeted)',118000]);
  return rows;
}
function fixedCard(){
  const rows=fixedRows();
  const tot=rows.reduce((a,r)=>a+r[1],0);
  let h='<div class="card"><h3>Havi fix költségek — ennyi megy el akkor is, ha nincs egy fillér bevétel sem</h3>';
  for(const r of rows) h+='<div class="row"><span class="m">'+r[0]+'</span><b>'+fmt(r[1])+'</b></div>';
  h+='<div class="hr"></div><div class="row"><span><b>Összesen</b></span><b class="big" style="color:var(--bad)">'+fmt(tot)+' / hó</b></div>';
  h+='<div class="help">'+(S.form==='mellek'?'Mellékállásban a nettó '+fmt(S.jobNet)+' fizetésed áll ezzel szemben — ami efölött van, azt a vállalkozás termeli meg.':'Ezt a vállalkozásnak kell kitermelnie, minden hónapban. Ehhez jön még negyedévente az adó'+(S.vat?' és az ÁFA':'')+'.')+'</div></div>';
  return h;
}

  if(S.form==='foallas')h+='<div class="hr"></div><button class="btn" onclick="foundKft()">Kft. alapítása (~3,6 M Ft kell hozzá)</button><div class="help">Alkalmazottak, nagy projektek, közbeszerzés, beruházási hitel — cserébe drágább működés és ÁFA-kör.</div>';

  h+='</div>';
  h+='<div class="card"><h3>Iroda</h3>'
   +'<div class="row"><span>Jelenlegi</span><b>'+['Home office (max 2 fő)','Kis bérelt iroda — 290 000 Ft/hó (max 6 fő)','Reprezentatív iroda — 680 000 Ft/hó'][S.office]+'</b></div>'
   +(S.office<1?'<button class="btn small sec" onclick="S.office=1;addLog(\'Kis irodát béreltél.\',\'info\');renderPanel()">Kis iroda bérlése</button> ':'')
   +(S.office<2&&S.form==='kft'?'<button class="btn small sec" onclick="S.office=2;addLog(\'Reprezentatív irodába költöztél. Hírnév +5.\',\'info\');S.rep=clamp(S.rep+5,0,100);renderPanel()">Nagy iroda bérlése</button>':'')
   +'</div>';
  h+='<div class="card"><h3>Felelősségbiztosítás</h3>'
   +'<div class="row"><span>Tervezői felelősségbiztosítás ('+(S.form==='kft'?'46':'24')+' e Ft/hó)</span><button class="btn small '+(S.insurance?'':'sec')+'" onclick="S.insurance=!S.insurance;renderPanel()">'+(S.insurance?'BEKAPCSOLVA':'kikapcsolva')+'</button></div>'
   +'<div class="help">Tervhiba esetén a biztosító fizet (100 e Ft önrésszel). Állami tenderhez kötelező. Nélküle egy komolyabb reklamáció milliókba kerülhet.</div></div>';
  h+='</div><div>';
  if(S.form!=='kft'){
    h+='<div class="card"><h3>Megélhetés — magánkivét</h3>'
     +'<div class="slider-row"><input type="range" min="250000" max="700000" step="10000" value="'+S.living+'" oninput="S.living=+this.value;this.nextElementSibling.textContent=fmt(S.living)+\' / hó\'"><b>'+fmt(S.living)+' / hó</b></div>'
     +'<div class="help">Lakhatás, rezsi, kaja, család — ennyi megy ki a kasszából minden hónap elején, bevételtől függetlenül. Szerényebb életmóddal több marad a cégben, de a 250 ezres alj alá nem tudsz menni. Évente az inflációval nő.</div></div>';
  } else {
    h+='<div class="card"><h3>Megélhetés</h3><div class="help">Kft.-ben a megélhetésedet a kötelező ügyvezetői béred fedezi (~430 000 Ft/hó céges költség) — külön magánkivét nincs.</div></div>';
  }
  h+='<div class="card"><h3>Marketing</h3>'
   +'<div class="slider-row"><input type="range" min="0" max="500000" step="10000" value="'+S.marketing+'" oninput="S.marketing=+this.value;this.nextElementSibling.textContent=fmt(S.marketing)+\' / hó\'"><b>'+fmt(S.marketing)+' / hó</b></div>'
   +'<div class="help">Honlap, hirdetések, szakmai jelenlét. Több megkeresést hoz, és a termékek eladását is hajtja. Túl sok pénzt is el lehet égetni vele.</div></div>';
  h+='<div class="card"><h3>Könyvelő</h3>'
   +['Olcsó (28 e Ft/hó) — kockázatos, NAV-bírság eshet be','Megbízható (48 e Ft/hó)','Prémium adótanácsadó (98 e Ft/hó) — adóoptimalizálás (−7% adó)'].map((t,i)=>'<div class="row"><span>'+t+'</span><button class="btn small '+(S.accountant===i?'':'sec')+'" onclick="S.accountant='+i+';renderPanel()">'+(S.accountant===i?'ő viszi':'váltás')+'</button></div>').join('')
   +'</div>';
  h+='<div class="card"><h3>Mentés / betöltés</h3>'
   +'<button class="btn small sec" onclick="document.getElementById(\'sv\').value=JSON.stringify(S)">Állás mentése a mezőbe</button> '
   +'<button class="btn small sec" onclick="try{S=JSON.parse(document.getElementById(\'sv\').value);migrateState();toast(\'Betöltve!\',\'ok\');renderAll();}catch(e){toast(\'Hibás mentés!\',\'bad\')}">Betöltés a mezőből</button> '
   +'<button class="btn small danger" onclick="if(confirm(\'Biztos újrakezded?\'))initGame()">Új játék</button>'
   +'<div style="margin-top:8px"><textarea id="sv" placeholder="Ide másolhatod a mentett játékállást... A szöveget mentsd el magadnak, és ide visszaillesztve folytathatod."></textarea></div></div>';
  h+='</div></div>';
  return h;
}

/* --- Napló --- */
function pLog(){
  return '<div class="card"><h3>Eseménynapló</h3><div class="log">'+S.log.map(l=>'<div><span class="d">'+dateShort(l.d)+'</span><span class="'+l.c+'">'+l.t+'</span></div>').join('')+'</div></div>';
}

/* ============ MAI NAP ============ */
function allocPreview(){
  const w=S.alloc,sum=Math.max(1,w.proj+w.prod+w.net+w.rest),f=Math.max(0,S.todayFree);
  return {proj:(f*w.proj/sum),prod:(f*w.prod/sum),net:(f*w.net/sum),rest:(f*w.rest/sum)};
}
function allocSlider(key,label,desc){
  return '<div style="margin-bottom:10px"><div class="row"><span><b>'+label+'</b> <span class="mut">'+desc+'</span></span><b id="al_'+key+'">'+allocPreview()[key].toFixed(1)+' óra</b></div>'
   +'<input type="range" min="0" max="10" step="1" value="'+S.alloc[key]+'" oninput="S.alloc.'+key+'=+this.value;updateAlloc()"></div>';
}
function updateAlloc(){
  const p=allocPreview();
  for(const k of ['proj','prod','net','rest']){ const el=document.getElementById('al_'+k); if(el)el.textContent=p[k].toFixed(1)+' óra'; }
}
function pDay(){
  const d=dow(S.day), wk=d<5;
  const sick=S.day<S.sickUntil;
  let h='<div class="grid2"><div>';
  h+='<div class="card"><h3>'+dateStr(S.day)+' — '+HDOW[d]+'</h3>';
  if(S.form==='mellek'&&wk) h+='<div class="row"><span class="m">Főállás (kötelező kör)</span><b>8 óra</b></div>';
  h+='<div class="row"><span class="m">Szabad munkaórád mára</span><b class="big">'+S.todayFree+' óra</b></div>';
  if(sick)h+='<div class="row"><span style="color:var(--bad);font-weight:700">Betegállományban vagy — minimál tempó ('+Math.max(0,S.sickUntil-S.day)+' nap még)</span></div>';
  h+='<div class="help">Az ajánlatírás azonnal órákat fogyaszt (kis terv 1, közepes 2, nagy 4, tender 8 óra). Ami megmarad, azt a lenti arányok szerint osztod be a nap végén.</div></div>';
  h+='<div class="card"><h3>Időbeosztás — mire menjen a maradék idő?</h3>'
   +allocSlider('proj','Projektmunka','a legszorosabb határidejű tervek készülnek')
   +allocSlider('prod','Termékfejlesztés','Excel-csomag, típustervek, webapp, kurzus')
   +allocSlider('net','Kapcsolatépítés','építész kávék, telefonok — új megkeresések, hírnév')
   +allocSlider('rest','Pihenés','stressz levezetése — kiégés ellen')
   +(S.form!=='mellek'?'<div class="row" style="margin-top:6px"><span>Hétvégén is dolgozom</span><button class="btn small '+(S.weekendWork?'':'sec')+'" onclick="S.weekendWork=!S.weekendWork;renderAll()">'+(S.weekendWork?'IGEN (+9 óra/hétvége, több stressz)':'nem')+'</button></div>':'')
   +'</div>';
  h+='<div class="card" style="text-align:center">'
   +'<button class="btn" style="font-size:16px;padding:12px 30px" onclick="nextDay()">Nap lezárása ▶</button> '
   +'<button class="btn sec" style="padding:12px 18px" onclick="nextDays(7)">▶▶ 7 nap</button>'
   +'<div class="help">A „7 nap" a mostani időbeosztással pörgeti a napokat, és megáll, ha esemény vagy új ajánlatkérés jön.</div></div>';
  h+='</div><div>';
  // figyelmeztetések
  const soon=S.projects.filter(p=>p.deadline-S.day<10).sort((a,b)=>a.deadline-b.deadline);
  const dueInv=S.invoices.filter(i=>i.status==='open').sort((a,b)=>a.due-b.due).slice(0,5);
  h+='<div class="card"><h3>Mai teendők, közelgő határidők</h3>';
  if(S.leads.length)h+='<div class="row"><span>📋 '+S.leads.length+' ajánlatkérés vár válaszra</span><button class="btn small sec" onclick="switchTab(\'leads\')">Megnézem</button></div>';
  if(soon.length)for(const p of soon.slice(0,4)){const dl=p.deadline-S.day;h+='<div class="row"><span>'+(dl<0?'🔴':'⏰')+' '+p.tn+' — '+p.name+'</span><b style="'+(dl<3?'color:var(--bad)':'')+'">'+(dl<0?Math.abs(dl)+' napja lejárt!':dl+' nap')+'</b></div>';}
  if(!S.leads.length&&!soon.length)h+='<div class="mut">Ma nincs égető teendő. Építkezz: termék, kapcsolatok, pihenés.</div>';
  h+='</div>';
  h+='<div class="card"><h3>Várható pénzmozgás</h3>';
  if(dueInv.length)for(const i of dueInv)h+='<div class="row"><span class="m">'+i.name+' ('+i.label+')'+(i.late?' — <b style="color:var(--bad)">késik</b>':'')+'</span><b>+'+fmtS(i.gross)+' · '+dateShort(i.due)+'</b></div>';
  else h+='<div class="mut">Nincs nyitott számla.</div>';
  const ftot=fixedRows().reduce((a,r)=>a+r[1],0);
  h+='<div class="row"><span class="m">Havi fix költség (hó elején terhelődik)</span><b style="color:var(--bad)">−'+fmtS(ftot)+'</b></div>';
  const c=calDate(S.day);
  if((c.m%3===2))h+='<div class="row"><span style="color:var(--warn)">⚠ Negyedév vége közeleg: adó'+(S.vat?' + ÁFA':'')+' befizetés jön ('+fmtS(S.taxDue+S.taoAcc+(S.vat?S.vatOwed:0))+')</span></div>';
  h+='</div>';
  h+='<div class="card"><h3>Napló (legutóbbi)</h3><div class="log">'+S.log.slice(0,8).map(l=>'<div><span class="d">'+dateShort(l.d)+'</span><span class="'+l.c+'">'+l.t+'</span></div>').join('')+'</div></div>';
  h+='</div></div>';
  return h;
}

/* ============ HAVI RIPORT ============ */
function estRemainingBill(p){
  const c=CLIENTS[p.cl];
  let rest=p.price;
  if(c.advance>0) rest-=p.price*c.advance;
  else if(p.price>=1800000) rest-=p.price*0.3;
  if(p.midBilled) rest-=p.price*0.3;
  return Math.max(0,rest);
}
function ledgerRows(list,neg){
  const m={};
  for(const e of list) m[e.t]=(m[e.t]||0)+e.a;
  const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  let h='', shown=arr.slice(0,11);
  for(const r of shown) h+='<div class="row"><span class="m">'+r[0]+'</span><b style="color:'+(neg?'var(--bad)':'var(--ok)')+'">'+(neg?'−':'+')+fmtS(r[1])+'</b></div>';
  if(arr.length>11)h+='<div class="mut">… és még '+(arr.length-11)+' kisebb tétel</div>';
  if(!arr.length)h+='<div class="mut">nem volt tétel</div>';
  return h;
}
function buildMonthlyReport(mk,rev,cost,profit){
  const y=Math.floor(mk/12),mo=mk%12;
  const led=S.monthLedger||[];
  const ins=led.filter(e=>e.k!=='out'), outs=led.filter(e=>e.k==='out');
  const openInv=S.invoices.filter(i=>i.status==='open').sort((a,b)=>a.due-b.due);
  const ar=openInv.reduce((a,i)=>a+i.gross,0);
  const unbilled=S.projects.reduce((a,p)=>a+estRemainingBill(p),0);
  const quoted=S.quotes.reduce((a,q)=>a+q.price,0);
  const fixTot=fixedRows().reduce((a,r)=>a+r[1],0);
  const debts=[];
  if(S.taxDue+S.taoAcc>0)debts.push(['Felhalmozott adó (negyedévkor esedékes)',Math.round(S.taxDue+S.taoAcc)]);
  if(S.vat&&S.vatOwed>0)debts.push(['ÁFA-kötelezettség',Math.round(S.vatOwed)]);
  if(S.loans.od.used>0)debts.push(['Folyószámlahitel kihasználva',Math.round(S.loans.od.used)]);
  for(const L of S.loans.list)debts.push([L.n+' fennálló tőke',Math.round(L.balance)]);
  const debtTot=debts.reduce((a,d)=>a+d[1],0);
  let h='<div class="grid2"><div>';
  const flow=rev+(S.form==='mellek'?S.jobNet:0)-cost;
  h+='<h4>Pénzügyi összegzés</h4>'
   +'<div class="row"><span>Vállalkozási bevétel</span><b style="color:var(--ok)">+'+fmtS(rev)+'</b></div>'
   +(S.form==='mellek'?'<div class="row"><span>Főállású fizetés (magán)</span><b style="color:var(--ok)">+'+fmtS(S.jobNet)+'</b></div>':'')
   +'<div class="row"><span>Összes kiadás (megélhetéssel együtt)</span><b style="color:var(--bad)">−'+fmtS(cost)+'</b></div>'
   +'<div class="row tot"><span>Havi nettó pénzáram</span><b style="color:'+(flow>=0?'var(--ok)':'var(--bad)')+'">'+(flow>=0?'+':'')+fmtS(flow)+'</b></div>'
   +'<div class="row"><span class="m">Ebből a vállalkozás eredménye</span><b style="color:'+(profit>=0?'var(--ok)':'var(--bad)')+'">'+fmtS(profit)+'</b></div>'
   +'<div class="row"><span>Készpénz a hónap végén</span><b>'+fmtS(S.cash)+'</b></div>';
  h+='<h4>Bevételek részletesen</h4>'+ledgerRows(ins,false);
  h+='<h4>Kiadások részletesen</h4>'+ledgerRows(outs,true);
  h+='</div><div>';
  h+='<h4>Folyamatban lévő munkák ('+S.projects.length+' db)</h4>';
  if(!S.projects.length)h+='<div class="mut">nincs futó projekt — ideje ajánlatot adni!</div>';
  for(const p of S.projects.slice().sort((a,b)=>a.deadline-b.deadline).slice(0,7)){
    const dl=p.deadline-S.day;
    h+='<div class="row"><span class="m">'+p.tn+' · '+Math.round((1-p.hLeft/p.hTot)*100)+'%'+(dl<0?' · <b style="color:var(--bad)">LEJÁRT</b>':' · '+dl+' nap')+'</span><b>'+fmtS(estRemainingBill(p))+'</b></div>';
  }
  if(S.projects.length>7)h+='<div class="mut">… és még '+(S.projects.length-7)+' projekt</div>';
  h+='<h4>Várható bevételek</h4>'
   +'<div class="row"><span>Kiszámlázva, fizetésre vár ('+openInv.length+' számla)</span><b>'+fmtS(ar)+'</b></div>'
   +(openInv.filter(i=>i.late).length?'<div class="row"><span class="m">ebből késésben</span><b style="color:var(--bad)">'+fmtS(openInv.filter(i=>i.late).reduce((a,i)=>a+i.gross,0))+'</b></div>':'')
   +'<div class="row"><span>Futó munkák még ki nem számlázott része</span><b>'+fmtS(unbilled)+'</b></div>'
   +(quoted?'<div class="row"><span>Elbírálás alatt lévő ajánlatok ('+S.quotes.length+' db)</span><b class="mut">'+fmtS(quoted)+'</b></div>':'')
   +'<div class="row tot"><span>Összesen a csőben</span><b>'+fmtS(ar+unbilled)+'</b></div>';
  h+='<h4>Várható kiadások, kötelezettségek</h4>'
   +'<div class="row"><span>Jövő havi fix költség (becslés)</span><b style="color:var(--bad)">−'+fmtS(fixTot)+'</b></div>';
  for(const d of debts)h+='<div class="row"><span class="m">'+d[0]+'</span><b style="color:var(--bad)">'+fmtS(d[1])+'</b></div>';
  h+='<div class="row tot"><span>Összes tartozás</span><b style="color:var(--bad)">'+fmtS(debtTot)+'</b></div>';
  h+='</div></div>';
  queueEvent({t:'📊 Havi zárás — '+y+'. '+HMON[mo], b:h, wide:true,
    o:[{l:'Rendben, jöhet a következő hónap!',s:'',f:()=>{}}]});
  S.monthLedger=[];
}

/* ============ MODÁL ============ */
function showNextEvent(){
  if(modalOpen||!S.evQ.length)return;
  const ev=S.evQ.shift();
  modalOpen=true;
  const w=document.getElementById('modalwrap'), m=document.getElementById('modal');
  m.classList.toggle('wide',!!ev.wide);
  m.innerHTML='<h2>'+ev.t+'</h2><div class="body'+(ev.wide?' rep':'')+'">'+ev.b+'</div><div class="opts">'
   +ev.o.map((o,i)=>'<button onclick="modalPick('+i+')"><b>'+o.l+'</b>'+(o.s?'<span>'+o.s+'</span>':'')+'</button>').join('')+'</div>';
  w.classList.add('on');
  window._ev=ev;
}
function modalPick(i){
  const ev=window._ev;
  document.getElementById('modalwrap').classList.remove('on');
  modalOpen=false;
  ev.o[i].f();
  renderAll();
  showNextEvent();
}

/* ============ KÖRÖK (MOTOR) ============ */
function dailyWorld(){
  if(!S.cashSeries)S.cashSeries=[];
  const r=leadRate();
  if(chance(Math.min(0.9,r))) genLead();
  if(r>1&&chance(r-1)) genLead();
  for(let i=S.quotes.length-1;i>=0;i--){ if(S.day>=S.quotes[i].resolve){ const q=S.quotes.splice(i,1)[0]; resolveQuote(q); } }
  S.leads=S.leads.filter(l=>l.expires>S.day);
  processInvoices();
  processMods();
  if(S.projects.length&&chance(iLive('aitan')?0.005:0.012)){
    const p=pick(S.projects);
    if(!p.rework){ p.rework=1; const extra=Math.round(p.hTot*rnd(0.1,0.22)); p.hLeft+=extra;
      addLog('Az építész áttervezett: +'+extra+' óra többletmunka — '+p.tn+' ('+p.name+')','warn'); }
  }
  const mk=monthKey(S.day);
  if(mk!==S.lastMonthKey){ S.lastMonthKey=mk; monthlyClose(); }
  if(S.day>=S.nextEvent){ fireRandomEvent(); S.nextEvent=S.day+ri(8,20); }
  S.cashSeries.push(Math.round(S.cash)); if(S.cashSeries.length>400)S.cashSeries.shift();
  checkSolvency(); checkWin();
}
function advanceDay(){
  endOfDayWork();
  S.day++;
  newDaySetup();
  dailyWorld();
}
function nextDay(){
  if(S.over||modalOpen)return;
  advanceDay();
  renderAll(); showNextEvent();
}
function nextDays(n){
  if(S.over||modalOpen)return;
  const lb=S.leads.length;
  for(let i=0;i<n;i++){
    advanceDay();
    if(S.evQ.length||S.over)break;
    if(S.leads.length>lb){ toast('Új ajánlatkérés érkezett — megálltunk.','ok'); break; }
  }
  renderAll(); showNextEvent();
}
function renderAll(){ renderHeader(); renderKpis(); renderTabs(); renderPanel(); }

/* ============ INDÍTÁS ============ */
function initGame(){
  S=newState();
  S.cashSeries=[S.cash];
  uiPrices={}; curTab='day';
  newDaySetup();
  genSubPool();
  addLog('2026. január 1. — Az épületgépész vállalkozásod hivatalosan is elindult (mellékállásban).','info');
  genLead(); genLead();
  renderAll();
  queueEvent({t:'Saját iroda. Egyszer. Talán.',
    b:'Épületgépész tervező vagy: nappal alkalmazott egy irodában (nettó '+fmt(S.jobNet)+'/hó), este a konyhaasztalnál rajzolod a saját munkáidat. Egyéni vállalkozást indítottál átalányadóval, van '+fmt(S.cash)+' megtakarításod, havi ~350 000 Ft megélhetési költséged és egy álmod: saját tervezőiroda, saját termékekkel, stabil bevétellel.<br><br>'
     +'<b>Így megy a játék:</b> minden kör egy nap. Hétköznap este ~3, hétvégén több szabad órád van. Ajánlatot írni időbe kerül, a maradék órákat a „Mai nap" fülön osztod be: projektmunka, termékfejlesztés, kapcsolatépítés, pihenés. A „Nap lezárása" gombbal lépsz tovább. Ha kevés a kezed, a Csapat fülön alvállalkozó tervezőket vonhatsz be már EV-ként is — alkalmazottat majd csak a Kft. után.<br><br>'
     +'<b>Amire számíts:</b> az ügyfelek alkudnak, a kivitelezők késve fizetnek (vagy sehogy), sokszor az olcsóbb konkurens nyer, az adót negyedévente egyben viszi el a NAV — és ha nem pihensz, kiégsz.',
    o:[{l:'Vágjunk bele!',s:'Sok szerencsét — kelleni fog.',f:()=>{}}]});
  showNextEvent();
}
window.addEventListener('load',()=>{ initGame(); });
